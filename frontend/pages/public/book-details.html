<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details — BookVerse</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="/pages/public/index.html">BookVerse</a>

      <ul class="nav-links">
        <li>
          <a href="/pages/public/index.html">Home</a>
        </li>
        <li>
          <a href="/pages/public/books.html">Browse Books</a>
        </li>
        <li>
          <a href="/pages/public/login.html">Login</a>
        </li>
        <li>
          <a href="/pages/public/register.html">Register</a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page-container">
    <p>
      <a href="/pages/public/books.html">← Back to Browse Books</a>
    </p>

    <section class="welcome-card" aria-labelledby="details-title">
      <p class="brand-label">Library catalogue</p>
      <h1 id="details-title">Book details</h1>
      <p class="description">
        Learn more about a book in your library.
      </p>
    </section>

    <section class="catalogue" aria-labelledby="information-title">
      <h2 id="information-title">About this book</h2>

      <div class="book-card">
       <p id="book-status" role="status">Loading book details...</p>
        <div id="book-details"></div>
      </div>
    </section>
   <section class="catalogue" aria-labelledby="borrow-title">
  <h2 id="borrow-title">Borrow this book</h2>

  <div class="book-card">
    <p id="borrow-status" role="status">
      Checking your login status...
    </p>

    <button
      type="button"
      id="borrow-button"
      class="auth-button"
      hidden
      disabled
    >
      Borrow this book
    </button>

    <a id="borrow-login" href="/pages/public/login.html" hidden>
      Log in to borrow
    </a>
  </div>
</section>
  </main>
</body>
<dialog id="wishlist-dialog" aria-labelledby="wishlist-title">
  <h2 id="wishlist-title">Add to wishlist</h2>
  <p id="wishlist-book-title"></p>

  <div class="form-field">
    <label for="wishlist-shelf">Choose your bookshelf</label>
    <select id="wishlist-shelf"></select>
  </div>

  <button
    id="wishlist-add"
    class="auth-button"
    type="button"
    style="margin-top: 16px;"
  >
    Add to selected bookshelf
  </button>

  <hr>

  <form id="wishlist-create-form">
    <div class="form-field">
      <label for="wishlist-name">Create a new private bookshelf</label>
      <input
        id="wishlist-name"
        type="text"
        maxlength="100"
        placeholder="For example: My wishlist"
        required
      >
    </div>

    <button
      class="auth-button"
      type="submit"
      style="margin-top: 16px;"
    >
      Create bookshelf
    </button>
  </form>

  <p id="wishlist-status" role="status"></p>

  <button id="wishlist-close" class="nav-logout" type="button">
    Close
  </button>
</dialog>
<script src="/js/wishlist.js"></script>
<script src="/js/bookDetails.js"></script>
<script src="/js/navbar.js"></script>
</html>
